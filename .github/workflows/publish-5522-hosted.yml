name: Publish Alpha55.22 Hosted

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-5522-hosted.yml"
      - "temp/delta5522.b64.part*"

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_VERSION: "4.7.1"
      BASE_BUILD: "5506"
      BUILD: "5522"
      VERSION: "0.1.0-alpha.55.22-contested-pull"
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot and GDRE Tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/godot tools/gdre work/project build/hotupdate
          curl -fL --retry 5 --retry-delay 2 "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip" -o tools/godot.zip
          unzip -q tools/godot.zip -d tools/godot
          chmod +x tools/godot/Godot_v4.7.1-stable_linux.x86_64
          curl -fL --retry 5 --retry-delay 2 "https://github.com/GDRETools/gdsdecomp/releases/download/v2.6.4/GDRE_tools-v2.6.4-linux.zip" -o tools/gdre.zip
          unzip -q tools/gdre.zip -d tools/gdre
          chmod +x tools/gdre/gdre_tools.x86_64
          tools/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Download stable 5506 base and published 5518 cumulative patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 "https://github.com/viator-xie/storm-city-eater-updates/releases/download/base-5506/STORM_CITY_EATER_BASE_5506.pck" -o build/hotupdate/base5506.pck
          curl -fL --retry 5 --retry-delay 2 "https://github.com/viator-xie/storm-city-eater-updates/releases/download/build-5518/STORM_CITY_EATER_PATCH_5518.pck" -o build/hotupdate/patch5518.pck
          echo "f14bc49906ef96f4b25ff84fec8c330ba7e0c8ec3ccaf24decd09a31de4d8b2e  build/hotupdate/base5506.pck" | sha256sum -c -
          echo "911e1a9227b78a7326d89da969d6294e5937df3d2518264de1b08b3099c9fe8e  build/hotupdate/patch5518.pck" | sha256sum -c -

      - name: Reconstruct 5518 project and apply 5522 source delta
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_SILENCE_ROOT_WARNING=1
          tools/gdre/gdre_tools.x86_64 --headless --recover=build/hotupdate/base5506.pck --output=work/project > build/hotupdate/recover-base.log 2>&1
          tools/gdre/gdre_tools.x86_64 --headless --recover=build/hotupdate/patch5518.pck --output=work/project > build/hotupdate/recover-5518.log 2>&1
          cat temp/delta5522.b64.part* > /tmp/delta5522.b64
          test "$(wc -c < /tmp/delta5522.b64)" -eq 34648
          base64 -d /tmp/delta5522.b64 > /tmp/delta5518_to_5522_sources.tar.gz
          echo "413bc95b7f1bf651c2390ab0fca2900991f29538736c4fce43917dfd029e8c53  /tmp/delta5518_to_5522_sources.tar.gz" | sha256sum -c -
          tar -xzf /tmp/delta5518_to_5522_sources.tar.gz -C work/project
          cat > work/project/export_presets.cfg <<'EOF'
          [preset.0]
          name="Windows Desktop"
          platform="Windows Desktop"
          runnable=true
          advanced_options=false
          export_filter="all_resources"
          include_filter="data/tokyo_core/*.json"
          exclude_filter=""
          export_path="build/STORM_CITY_EATER.exe"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2
          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          debug/export_console_wrapper=0
          binary_format/embed_pck=false
          binary_format/architecture="x86_64"
          texture_format/bptc=true
          texture_format/s3tc=true
          texture_format/etc2=false
          EOF
          grep -q 'standalone_level_safe_boot_v6.gd' work/project/scenes/CityLevel.tscn
          grep -q 'var dx: float' work/project/scripts/tornado_arena_player.gd

      - name: Import and run battle regression smokes
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_SILENCE_ROOT_WARNING=1
          G=tools/godot/Godot_v4.7.1-stable_linux.x86_64
          "$G" --headless --path work/project --import 2>&1 | tee build/hotupdate/import.log
          if grep -E 'SCRIPT ERROR:|Compile Error:|Parse Error:|Failed to load script' build/hotupdate/import.log; then exit 1; fi
          for spec in \
            'arena_5520_contract_smoke:ARENA_5520_CONTRACT_PASS' \
            'arena_5521_battle_loop_smoke:ARENA_5521_BATTLE_LOOP_PASS' \
            'arena_5522_contested_pull_smoke:ARENA_5522_CONTESTED_PULL_PASS'; do
            test_name="${spec%%:*}"
            marker="${spec#*:}"
            "$G" --headless --path work/project --script "res://scripts/${test_name}.gd" 2>&1 | tee "build/hotupdate/${test_name}.log"
            grep -q "$marker" "build/hotupdate/${test_name}.log"
          done
          echo 'ALPHA5522_HOSTED_SMOKES_PASS'

      - name: Export cumulative 5506 to 5522 patch
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_SILENCE_ROOT_WARNING=1
          G=tools/godot/Godot_v4.7.1-stable_linux.x86_64
          base="$(realpath build/hotupdate/base5506.pck)"
          patch="$(realpath -m build/hotupdate/STORM_CITY_EATER_PATCH_5522.pck)"
          "$G" --headless --path work/project --patches "$base" --export-patch "Windows Desktop" "$patch" 2>&1 | tee build/hotupdate/export.log
          test -s "$patch"
          bytes="$(stat -c%s "$patch")"
          sha="$(sha256sum "$patch" | awk '{print $1}')"
          echo "PATCH_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PATCH_SHA=$sha" >> "$GITHUB_ENV"
          echo "ALPHA5522_PATCH_READY bytes=$bytes sha256=$sha"

      - name: Build manifest and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          build=5522
          manifest={
            'schema':1,
            'channel':'alpha',
            'base_build':5506,
            'build':build,
            'version':'0.1.0-alpha.55.22-contested-pull',
            'title':'Alpha55.22 · 龙卷风大作战公平争抢',
            'notes':'从公开的5518直接升级到5522：补齐龙卷风大作战竞技闭环，包括PC 24个NPC、局部人口流送、NPC互相觅食/追弱避强、真实排行榜、世界空间血条与威胁颜色、死亡节点复用、玩家与NPC重生保护、224个以内的动态稀疏资源生态、整栋建筑计分、击败后共享死亡残骸及NPC抢夺残骸。55.22进一步修复多人同时卷同一地面物体时的调用顺序偏差：同一物理帧达到起飞阈值的候选在帧末统一仲裁，依次按吸力积累、当前风压、距离和稳定ID决定归属，避免脚本先执行的一方天然占优。Alpha48近距离龙卷风视觉继续保持锁定。',
            'mandatory':False,
            'package':{
              'kind':'patch','base_build':5506,
              'url':'https://github.com/viator-xie/storm-city-eater-updates/releases/download/build-5522/STORM_CITY_EATER_PATCH_5522.pck',
              'sha256':os.environ['PATCH_SHA'],
              'bytes':int(os.environ['PATCH_BYTES'])
            }
          }
          open('build/hotupdate/version.json','w',encoding='utf-8').write(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
          sha256sum build/hotupdate/STORM_CITY_EATER_PATCH_5522.pck build/hotupdate/version.json > build/hotupdate/SHA256SUMS.txt
          if gh release view build-5522 >/dev/null 2>&1; then
            gh release upload build-5522 build/hotupdate/STORM_CITY_EATER_PATCH_5522.pck build/hotupdate/version.json build/hotupdate/SHA256SUMS.txt --clobber
            gh release edit build-5522 --title 'Alpha55.22 · 龙卷风大作战公平争抢' --notes '5506 基线累计更新到 5522；包含 55.20/55.21 竞技闭环与 55.22 同帧公平争抢仲裁。' --latest
          else
            gh release create build-5522 build/hotupdate/STORM_CITY_EATER_PATCH_5522.pck build/hotupdate/version.json build/hotupdate/SHA256SUMS.txt --title 'Alpha55.22 · 龙卷风大作战公平争抢' --notes '5506 基线累计更新到 5522；包含 55.20/55.21 竞技闭环与 55.22 同帧公平争抢仲裁。' --latest
          fi

      - name: Publish stable version.json
        shell: bash
        run: |
          set -euo pipefail
          cp build/hotupdate/version.json version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          if git diff --cached --quiet; then
            echo 'Manifest already current.'
          else
            git commit -m 'Publish Alpha55.22 manifest'
            git push
          fi
          echo 'ALPHA5522_PUBLIC_RELEASE_COMPLETE'
