name: TEMP Bridge Base 5506 PCK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-bridge-5518.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download published base patch
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/viator-xie/storm-city-eater-updates/releases/download/build-5506/STORM_CITY_EATER_PATCH_5506.pck"
          curl -fL --retry 5 --retry-delay 2 "$url" -o STORM_CITY_EATER_PATCH_5506.pck
          echo "35efacfafc7904e4399164e75f9f7961c4c749a9bf2ab71a60242318008d2229  STORM_CITY_EATER_PATCH_5506.pck" | sha256sum -c -
          test "$(stat -c%s STORM_CITY_EATER_PATCH_5506.pck)" = "8022444"
      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: storm-5506-pck-bridge
          path: STORM_CITY_EATER_PATCH_5506.pck
          retention-days: 1
          if-no-files-found: error
