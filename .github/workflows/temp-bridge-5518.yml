name: TEMP Bridge Full 5506 Client

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-bridge-5518.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download published full client
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/viator-xie/storm-city-eater-updates/releases/download/build-5506/STORM_CITY_EATER_ALPHA55_6_FULL.zip"
          curl -fL --retry 5 --retry-delay 2 "$url" -o STORM_CITY_EATER_ALPHA55_6_FULL.zip
          echo "bd86922466ec0628d930f6d5428a24c09669295a0f734ba8b948791e57a479ba  STORM_CITY_EATER_ALPHA55_6_FULL.zip" | sha256sum -c -
          test "$(stat -c%s STORM_CITY_EATER_ALPHA55_6_FULL.zip)" = "42813773"
      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: storm-5506-full-client-bridge
          path: STORM_CITY_EATER_ALPHA55_6_FULL.zip
          retention-days: 1
          if-no-files-found: error
