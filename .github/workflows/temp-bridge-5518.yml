name: TEMP Bridge GDRE Linux

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-bridge-5518.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download GDRE Tools Linux
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/GDRETools/gdsdecomp/releases/download/v2.6.4/GDRE_tools-v2.6.4-linux.zip"
          curl -fL --retry 5 --retry-delay 2 "$url" -o GDRE_tools-v2.6.4-linux.zip
          echo "eda8cb09e64a060728fa371aa80ae148d3c5584a7de2f553699936daa84e7b4e  GDRE_tools-v2.6.4-linux.zip" | sha256sum -c -
      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdre-tools-linux-bridge
          path: GDRE_tools-v2.6.4-linux.zip
          retention-days: 1
          if-no-files-found: error
