name: TEMP Private Source Checkout Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-bridge-5518.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout private source main
        uses: actions/checkout@v4
        with:
          repository: viator-xie/-
          ref: main
          token: ${{ secrets.UPDATE_REPO_TOKEN }}
          path: source
      - name: Verify Alpha55.22 source
        shell: bash
        run: |
          set -euo pipefail
          test -s source/project.godot
          test -s source/scripts/current_build_stamp.gd
          grep -q 'BUILT_BUILD := 5522' source/scripts/current_build_stamp.gd
          grep -q '0.1.0-alpha.55.22-contested-pull' source/project.godot
          echo PRIVATE_SOURCE_5522_CHECKOUT_PASS
